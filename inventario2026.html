<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>INVENTARIO 2026 · 부스 가이드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
@font-face{font-family:'Kkukkuk';src:url('./MemomentKkukkukk.ttf') format('truetype')}

/* ── 색상 변수 ── */
:root{
  --zs:#F080A0; --zw:#70C8F0; --zwk:#F0C800;
  --zd:#60C080; --zp:#4080D0; --zo:#606060;
  --zk:#40C0B8; --zc:#A0A0A0;
}
[data-theme=white]{
  --bg:#fff;--sf:#fff;--sf2:#f3f3f3;
  --tx:#0f0f0f;--tx2:#505050;--tx3:#aaa;--br:#e8e8e8;
  --ac:#0f0f0f;--as:#efefef;--nav:#ffffffee;
  --csh:0 1px 5px rgba(0,0,0,.07);
  --hg:linear-gradient(150deg,#fff 0%,#f8f8f8 100%);
}
[data-theme=black]{
  --bg:#080808;--sf:#111;--sf2:#1a1a1a;
  --tx:#f0ece4;--tx2:#787878;--tx3:#404040;--br:#222;
  --ac:#e8d5b0;--as:#1c180e;--nav:#080808ee;
  --csh:0 2px 12px rgba(0,0,0,.6);
  --hg:linear-gradient(150deg,#0d0d0d 0%,#080808 100%);
}
[data-theme=pastel]{
  --bg:#fff;--sf:#fff;--sf2:#fff0f5;
  --tx:#2a1828;--tx2:#80506a;--tx3:#c098b0;--br:#f0d0e0;
  --ac:#c05080;--as:#ffe8f0;--nav:#ffffffee;
  --csh:0 2px 8px rgba(200,60,100,.06);
  --hg:linear-gradient(150deg,#fff 0%,#fff0f5 60%,#ffe8f2 100%);
  --zs:#F4A0B8;--zw:#90D0F4;--zwk:#F8DC70;
  --zd:#80CC98;--zp:#78A4E0;--zo:#909090;
  --zk:#70D0C8;--zc:#C0C0C0;
}
[data-theme=pastel]::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:radial-gradient(ellipse 90% 60% at 18% 22%,rgba(255,140,185,.25) 0%,transparent 55%),
             radial-gradient(ellipse 70% 85% at 78% 70%,rgba(255,160,200,.2) 0%,transparent 55%);
}

/* ── 리셋 ── */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Pretendard','Noto Sans KR',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;transition:background .3s,color .3s}

/* ── NAV ── */
nav{position:sticky;top:0;z-index:300;background:var(--nav);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--br);padding:0 1.25rem;height:52px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:'Kkukkuk','Pretendard',sans-serif;font-size:17px;letter-spacing:.06em;color:var(--tx);cursor:pointer}
.nav-r{display:flex;align-items:center;gap:6px}
.nav-links{display:flex;gap:1px}
.nl{padding:5px 10px;border-radius:999px;background:transparent;border:none;color:var(--tx3);font-size:12px;cursor:pointer;font-family:inherit;transition:all .15s;min-height:44px;display:flex;align-items:center}
.nl:hover{color:var(--tx);background:var(--sf2)}
.tdw{position:relative}
.tdb{display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:999px;border:1px solid var(--br);background:var(--sf);color:var(--tx2);font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap;min-height:36px}
.tdb:hover{background:var(--sf2)}
.tsw{width:8px;height:8px;border-radius:50%}
.tdm{display:none;position:absolute;top:calc(100% + 5px);right:0;background:var(--sf);border:1px solid var(--br);border-radius:12px;padding:5px;min-width:120px;box-shadow:0 8px 28px rgba(0,0,0,.14);z-index:400}
.tdw:hover .tdm,.tdw:focus-within .tdm{display:block}
.topt{display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--tx2);min-height:44px}
.topt:hover{background:var(--sf2);color:var(--tx)}
.topt.on{color:var(--ac);font-weight:600}
.tdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}

/* ── MAIN ── */
main{max-width:1020px;margin:0 auto;padding:0 1.25rem 6rem}

/* ── HERO ── */
#hero{text-align:center;padding:2.5rem 0 1.75rem;border-bottom:1px solid var(--br);margin-bottom:1.75rem;background:var(--hg);border-radius:0 0 16px 16px}
.hero-sub{font-size:10px;letter-spacing:.22em;color:var(--tx3);text-transform:uppercase;margin-bottom:.6rem}
.hero-title{font-family:'Kkukkuk','Pretendard',sans-serif;font-size:clamp(1.8rem,6vw,3.2rem);letter-spacing:.1em;color:var(--tx);margin-bottom:.4rem;cursor:pointer;transition:opacity .2s}
.hero-title:hover{opacity:.6}
.hero-div{width:28px;height:1px;background:var(--br);margin:.75rem auto}
.hero-info{display:flex;justify-content:center;gap:1.5rem;flex-wrap:wrap;font-size:12px;color:var(--tx2)}
.hi{display:flex;align-items:center;gap:4px}
.hi strong{color:var(--tx);font-weight:500}
.stat-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:1.25rem}
.sstat{display:flex;align-items:center;gap:5px;padding:6px 15px;border-radius:999px;background:var(--sf);border:1px solid var(--br);color:var(--tx2);font-size:12px;cursor:pointer;font-family:inherit;transition:all .18s;box-shadow:var(--csh);min-height:44px}
.sstat:hover{border-color:var(--ac);color:var(--ac);transform:translateY(-1px)}
.sstat.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.sstat strong{font-weight:700}

/* ── SECTION TITLE ── */
.st{font-family:'Kkukkuk','Pretendard',sans-serif;font-size:16px;letter-spacing:.06em;color:var(--tx);margin-bottom:.875rem;display:flex;align-items:center;gap:9px}
.st::after{content:'';flex:1;height:1px;background:var(--br)}

/* ── 카테고리 칩 ── */
.cat-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem}
.chip{display:flex;align-items:center;gap:4px;padding:6px 13px;border-radius:999px;border:1px solid var(--br);background:var(--sf);color:var(--tx2);font-size:11px;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap;min-height:36px}
.chip:hover{background:var(--sf2);color:var(--tx)}
.chip.on{color:#fff;border-color:transparent;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.cdot{width:6px;height:6px;border-radius:50%;flex-shrink:0}

/* ── MAP ── */
#sec-map{margin-bottom:2rem}
.map-outer{background:var(--sf);border:1px solid var(--br);border-radius:14px;padding:1rem;overflow:hidden;box-shadow:var(--csh)}
.map-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.map-legend{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:.75rem;padding-bottom:.75rem;border-bottom:1px solid var(--br)}
.mleg{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--tx2)}
.mlegdot{width:8px;height:8px;border-radius:2px;flex-shrink:0}

/* 이미지+히트박스 */
.map-wrap{position:relative;min-width:700px;aspect-ratio:2126/692}
.map-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;border-radius:6px;pointer-events:none}

/* ── 히트박스 (투명 클릭 영역만) ── */
.hb{
  position:absolute;cursor:pointer;
  background:transparent;border:none;
  border-radius:3px;z-index:2;
  transition:background .12s,box-shadow .12s;
  /* 최소 터치 영역 보장 */
  min-width:44px;min-height:44px;
}
.hb:hover{background:rgba(255,255,255,.2);box-shadow:inset 0 0 0 2px rgba(255,255,255,.75)}
[data-theme=black] .hb:hover{background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)}
/* 찜한 부스 */
.hb.fav{box-shadow:inset 0 0 0 2.5px gold;background:rgba(255,210,0,.15)}
/* dim - 카테고리 필터 시 비해당 부스 어둡게 */
.hb.dim{background:rgba(0,0,0,.45);pointer-events:none}
[data-theme=pastel] .hb.dim{background:rgba(100,50,80,.35)}
/* 검색 하이라이트 */
@keyframes hlt{0%,100%{box-shadow:inset 0 0 0 3px #FFD400,0 0 0 0 #FFD40000}50%{box-shadow:inset 0 0 0 3px #FFD400,0 0 8px 4px #FFD40066}}
.hb.search-hl{animation:hlt .5s ease-in-out 5;background:rgba(255,212,0,.18)}
/* KIOSK 타원 */
.hb.oval{border-radius:50%}

/* ── 찜한 브랜드 ── */
#sec-fav{margin-bottom:2rem}
.fav-empty{text-align:center;padding:1.5rem;color:var(--tx3);font-size:13px;background:var(--sf);border:1px dashed var(--br);border-radius:12px;line-height:1.8}
.fav-list{display:flex;flex-wrap:wrap;gap:8px}
.fav-chip{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--sf2);border:1px solid var(--br);font-size:13px;color:var(--tx);cursor:pointer;transition:all .15s;min-height:44px}
.fav-chip:hover{border-color:gold;background:rgba(255,210,0,.1)}
.fav-dot{width:7px;height:7px;border-radius:50%}

/* ── 검색 ── */
#sec-search{margin-bottom:2rem}
.sbox{position:relative}
.sbox input{width:100%;padding:14px 16px 14px 46px;border-radius:14px;border:1px solid var(--br);background:var(--sf);color:var(--tx);font-size:14px;font-family:inherit;outline:none;transition:border-color .2s,box-shadow .2s;box-shadow:var(--csh);-webkit-appearance:none}
.sbox input:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--as)}
.sbox input::placeholder{color:var(--tx3)}
.sico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--tx3);font-size:16px;pointer-events:none}
.sclr{position:absolute;right:13px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--tx3);cursor:pointer;font-size:18px;display:none;line-height:1;min-width:44px;min-height:44px;display:none;align-items:center;justify-content:center}

/* ── 브랜드 목록 ── */
#sec-brands{margin-bottom:2.5rem}
.zblock{margin-bottom:1.75rem}
.zhdr{display:flex;align-items:center;gap:8px;margin-bottom:.75rem;padding-bottom:7px;border-bottom:1px solid var(--br)}
.zhdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.zhname{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--tx2)}
.zhcnt{font-size:11px;color:var(--tx3);margin-left:auto}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:7px}
.bcard{background:var(--sf);border:1px solid var(--br);border-radius:11px;padding:13px;cursor:pointer;transition:all .18s;position:relative;overflow:hidden;box-shadow:var(--csh)}
.bcard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--zc,var(--br));border-radius:11px 11px 0 0}
.bcard:hover{transform:translateY(-2px);box-shadow:0 7px 20px rgba(0,0,0,.1)}
.bcard.fav{border-color:gold;box-shadow:0 0 0 1.5px gold}
.bcard.dim-brand{opacity:.2;pointer-events:none}
.bc-booth{font-size:10px;font-weight:700;letter-spacing:.06em;margin-bottom:4px}
.bc-kr{font-size:13px;font-weight:500;color:var(--tx);line-height:1.3;margin-bottom:2px}
.bc-en{font-size:10.5px;color:var(--tx3);line-height:1.3;margin-bottom:9px}
.bc-acts{display:flex;gap:4px}
.bc-btn{flex:1;padding:7px 0;border-radius:7px;border:1px solid var(--br);background:transparent;color:var(--tx3);font-size:11px;cursor:pointer;font-family:inherit;transition:all .13s;min-height:36px}
.bc-btn:hover{background:var(--sf2);color:var(--tx)}
.bc-btn.on{background:#fef0f3;color:var(--zs);border-color:var(--zs)}
[data-theme=black] .bc-btn.on{background:#2a1018}

/* ── FAB ── */
.fab{position:fixed;bottom:20px;right:16px;z-index:250;width:60px;height:60px;border-radius:50%;background:var(--sf);color:var(--tx2);border:1px solid var(--br);font-size:24px;cursor:pointer;box-shadow:0 2px 14px rgba(0,0,0,.14);display:flex;align-items:center;justify-content:center;transition:all .2s}
.fab:hover{transform:scale(1.1)}
.fab-badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:999px;background:var(--zs);color:#fff;font-size:10px;font-weight:700;display:none;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--bg)}
.fab-badge.show{display:flex}

/* ── 메모 시트 ── */
.sheet-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:400;align-items:flex-end;justify-content:center}
.sheet-ov.open{display:flex}
.sheet{background:var(--sf);border-radius:18px 18px 0 0;padding:.875rem 1.25rem 2.5rem;width:100%;max-width:580px;max-height:80vh;overflow-y:auto;border-top:1px solid var(--br);box-shadow:0 -6px 32px rgba(0,0,0,.14)}
.sheet-handle{width:30px;height:3px;border-radius:2px;background:var(--br);margin:0 auto .875rem}
.sheet-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.sheet-title{font-family:'Kkukkuk','Pretendard',sans-serif;font-size:16px;letter-spacing:.06em;color:var(--tx)}
.sheet-x{background:none;border:none;color:var(--tx3);font-size:20px;cursor:pointer;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center}
.memo-add{display:flex;gap:7px;margin-bottom:1rem}
.memo-add input{flex:1;padding:12px;border-radius:10px;border:1px solid var(--br);background:var(--bg);color:var(--tx);font-size:14px;font-family:inherit;outline:none;-webkit-appearance:none}
.memo-add input:focus{border-color:var(--ac)}
.memo-add input::placeholder{color:var(--tx3)}
.madd{padding:12px 18px;border-radius:10px;background:var(--tx);color:var(--bg);border:none;font-size:13px;cursor:pointer;font-family:inherit;font-weight:600;transition:opacity .2s;min-height:44px;white-space:nowrap}
.madd:hover{opacity:.8}
.memo-list{display:flex;flex-direction:column;gap:7px}
.memo-item{display:flex;align-items:center;gap:10px;padding:12px;background:var(--sf2);border-radius:10px}
.memo-chk{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--br);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .15s;background:transparent}
.memo-chk.done{background:var(--zd);border-color:var(--zd);color:#fff}
.memo-brand{font-size:10px;font-weight:600;padding:2px 7px;border-radius:999px;color:#fff;margin-bottom:2px;display:inline-block}
.memo-txt{font-size:13px;color:var(--tx);line-height:1.4}
.memo-txt.done{text-decoration:line-through;color:var(--tx3)}
.memo-del{background:none;border:none;color:var(--tx3);cursor:pointer;font-size:16px;margin-left:auto;flex-shrink:0;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center}
.memo-del:hover{color:#e03030}
.memo-empty{text-align:center;padding:2rem;color:var(--tx3);font-size:13px}

/* ── 브랜드 모달 ── */
.mov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;align-items:center;justify-content:center;padding:1rem}
.mov.open{display:flex}
.mdlg{background:var(--sf);border-radius:18px;padding:1.5rem;max-width:380px;width:100%;border:1px solid var(--br);max-height:90vh;overflow-y:auto;box-shadow:0 16px 55px rgba(0,0,0,.22);animation:su .2s ease}
@keyframes su{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.m-close-row{display:flex;justify-content:flex-end;margin-bottom:.5rem}
.m-close{background:none;border:none;color:var(--tx3);font-size:22px;cursor:pointer;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.m-close:hover{background:var(--sf2)}
.m-cat-tag{display:inline-block;font-size:11px;padding:4px 12px;border-radius:999px;margin-bottom:.875rem;font-weight:600}
.m-booth{font-size:12px;font-weight:700;letter-spacing:.1em;margin-bottom:.5rem}
.m-brand{font-family:'Kkukkuk','Pretendard',sans-serif;font-size:22px;color:var(--tx);margin-bottom:3px;line-height:1.3}
.m-brand-en{font-size:13px;color:var(--tx3);margin-bottom:1.25rem}
.m-actions{display:flex;flex-direction:column;gap:8px;margin-top:1.25rem}
.m-btn{width:100%;padding:14px;border-radius:11px;border:1px solid var(--br);background:transparent;color:var(--tx2);font-size:13px;cursor:pointer;font-family:inherit;font-weight:500;transition:all .15s;min-height:48px;display:flex;align-items:center;justify-content:center;gap:7px}
.m-btn:hover{background:var(--sf2)}
.m-btn.primary{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.m-btn.fav-on{background:#fef0f3;color:var(--zs);border-color:var(--zs)}
[data-theme=black] .m-btn.fav-on{background:#2a1018}
.m-btn.ig{background:#E1306C;color:#fff;border-color:#E1306C}
.m-btn.ig:hover{opacity:.85}

.bcard.dim-b{opacity:.2;pointer-events:none}
.nores{text-align:center;padding:2.5rem;color:var(--tx3);font-size:14px}

/* ── 모바일 ── */
@media(max-width:600px){
  nav{padding:0 .875rem}
  .nav-links{display:none}
  main{padding:0 .875rem 5rem}
  .cgrid{grid-template-columns:repeat(2,1fr)}
  .hero-title{font-size:1.8rem}
  .hero-info{gap:.875rem;font-size:11px}
  .memo-add{flex-wrap:wrap}
  .hb{min-width:36px;min-height:36px}
}
</style>
</head>
<body data-theme="white">

<nav>
  <div class="logo" onclick="goTop()">INVENTARIO 2026</div>
  <div class="nav-r">
    <div class="nav-links">
      <button class="nl" onclick="goSec('sec-map')">배치도</button>
      <button class="nl" onclick="goSec('sec-fav')">찜</button>
      <button class="nl" onclick="goSec('sec-search')">검색</button>
      <button class="nl" onclick="goSec('sec-brands')">브랜드</button>
    </div>
    <div class="tdw">
      <button class="tdb"><div class="tsw" id="tsw"></div><span id="tlbl">🎨</span><span style="font-size:9px;color:var(--tx3)">▾</span></button>
      <div class="tdm">
        <div class="topt" data-t="white" onclick="setTheme('white')"><div class="tdot" style="background:#e0e0e0"></div>White</div>
        <div class="topt" data-t="black" onclick="setTheme('black')"><div class="tdot" style="background:#1c1c1c"></div>Black</div>
        <div class="topt" data-t="pastel" onclick="setTheme('pastel')"><div class="tdot" style="background:#ffb8d0"></div>Pastel</div>
      </div>
    </div>
  </div>
</nav>

<main>

<section id="hero">
  <div class="hero-sub">현장 부스 가이드</div>
  <div class="hero-title" onclick="goTop()">INVENTARIO 2026</div>
  <div class="hero-div"></div>
  <div class="hero-info">
    <div class="hi">📅 <strong>6.10 — 6.14</strong></div>
    <div class="hi">⏰ 평일·토 <strong>11–19시</strong> / 일 <strong>11–18시</strong></div>
    <div class="hi">📍 <strong>코엑스 더플라츠 1&amp;2</strong></div>
  </div>
  <div class="stat-row">
    <button class="sstat" id="sb-fav" onclick="goSec('sec-fav')">⭐ 찜 <strong id="cnt-fav">0</strong>개</button>
    <button class="sstat" onclick="openMemo()">📝 메모 <strong id="cnt-memo">0</strong>개</button>
  </div>
</section>

<!-- ① 배치도 -->
<section id="sec-map" style="margin-bottom:2rem">
  <div class="st">배치도</div>
  <div class="cat-row" id="map-cats"></div>
  <!-- Hall 레이블 -->
  <div style="display:flex;justify-content:space-around;padding:0 4px;margin-bottom:6px">
    <span style="font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--tx3)">← PLATZ HALL 2</span>
    <span style="font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--tx3)">LOUNGE</span>
    <span style="font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--tx3)">PLATZ HALL 1 →</span>
  </div>
  <div class="map-outer">
    <div class="map-legend" id="map-legend"></div>
    <div class="map-scroll">

/* ══════════════════════════════════════════════
   초성 검색
══════════════════════════════════════════════ */
const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function getChosung(s){return s.split('').map(c=>{const n=c.charCodeAt(0)-0xAC00;return(n>=0&&n<=11171)?CHO[Math.floor(n/28/21)]:c}).join('')}
function nm(s){return(s||'').toLowerCase().replace(/\s/g,'')}

function boothMatch(b, q){
  if(!q) return true;
  const nq = nm(q);
  const brands = Array.isArray(b.brand) ? b.brand : [b.brand];
  const brandEns = Array.isArray(b.brandEn) ? b.brandEn : [b.brandEn];
  return (
    nm(b.booth).includes(nq) ||
    brands.some(br => nm(br).includes(nq) || getChosung(br).includes(getChosung(q))) ||
    brandEns.some(be => nm(be).includes(nq))
  );
}

function brandDisplayName(b){
  if(Array.isArray(b.brand)) return b.brand.join(' · ');
  return b.brand;
}
function brandEnDisplayName(b){
  if(Array.isArray(b.brandEn)) return b.brandEn.join(' · ');
  return b.brandEn;
}

/* ══════════════════════════════════════════════
   STATE
══════════════════════════════════════════════ */
let curFilter = 'ALL';
let favorites = new Set(JSON.parse(localStorage.getItem('favorites') || '[]'));
let memos = JSON.parse(localStorage.getItem('shoppingNotes') || '[]');
let curModal = null;

function saveFavs(){ localStorage.setItem('favorites', JSON.stringify([...favorites])) }
function saveMemos(){ localStorage.setItem('shoppingNotes', JSON.stringify(memos)) }

/* ══════════════════════════════════════════════
   THEME
══════════════════════════════════════════════ */
const TSW = {white:'#e0e0e0', black:'#1c1c1c', pastel:'#ffb8d0'};
const TLB = {white:'White', black:'Black', pastel:'Pastel'};
function setTheme(t){
  document.body.setAttribute('data-theme', t);
  document.getElementById('tsw').style.background = TSW[t];
  document.getElementById('tlbl').textContent = '🎨 ' + TLB[t];
  document.querySelectorAll('.topt').forEach(o => o.classList.toggle('on', o.dataset.t === t));
}
function goTop(){ window.scrollTo({top:0, behavior:'smooth'}) }
function goSec(id){ document.getElementById(id)?.scrollIntoView({behavior:'smooth', block:'start'}) }

/* ══════════════════════════════════════════════
   카테고리 칩 렌더
══════════════════════════════════════════════ */
function renderCatChips(containerId){
  const el = document.getElementById(containerId);
  el.innerHTML = CATS.map(c => {
    const col = CAT_COLOR[c] || '';
    const on = c === curFilter;
    const dot = col ? `<div class="cdot" style="background:${col}"></div>` : '';
    const sty = on ? (col ? `background:${col};color:#fff;border-color:${col}` : `background:var(--tx);color:var(--bg);border-color:var(--tx)`) : '';
    return `<button class="chip${on?' on':''}" style="${sty}" onclick="setFilter('${c}')">${dot}${c}</button>`;
  }).join('');
}

function setFilter(cat){
  curFilter = cat;
  renderCatChips('map-cats');
  renderCatChips('brand-cats');
  updateHitboxDim();
  renderBrands();
}

/* ══════════════════════════════════════════════
   히트박스 렌더
══════════════════════════════════════════════ */
function renderHitboxes(){
  const container = document.getElementById('hitboxes');
  container.innerHTML = booths.filter(b => POS[b.booth]).map(b => {
    const p = POS[b.booth];
    const oval = OVAL_BOOTHS.has(b.booth) ? ' oval' : '';
    return `<div class="hb${oval}${favorites.has(b.booth)?' fav':''}"
      id="hb-${b.booth}"
      style="left:${p[0]}%;top:${p[1]}%;width:${p[2]}%;height:${p[3]}%"
      onclick="openModal('${b.booth}')"
      title="${brandDisplayName(b)}"></div>`;
  }).join('');
  updateHitboxDim();
}

function updateHitboxDim(){
  document.querySelectorAll('.hb[id]').forEach(el => {
    const boothId = el.id.replace('hb-','');
    const b = booths.find(x => x.booth === boothId);
    const matches = curFilter === 'ALL' || (b && b.category === curFilter);
    el.classList.toggle('dim', !matches);
  });
}

function updateHitboxFav(boothId){
  const el = document.getElementById('hb-' + boothId);
  if(el) el.classList.toggle('fav', favorites.has(boothId));
}

/* ══════════════════════════════════════════════
   범례
══════════════════════════════════════════════ */
function renderLegend(){
  document.getElementById('map-legend').innerHTML =
    Object.entries(CAT_COLOR).map(([z,c]) =>
      `<div class="mleg"><div class="mlegdot" style="background:${c}"></div>${z}</div>`
    ).join('');
}

/* ══════════════════════════════════════════════
   찜한 브랜드
══════════════════════════════════════════════ */
function renderFavs(){
  const el = document.getElementById('fav-area');
  const favList = booths.filter(b => favorites.has(b.booth));
  if(!favList.length){
    el.innerHTML = '<div class="fav-empty">아직 찜한 부스가 없어요 ⭐<br><span style="font-size:12px;margin-top:4px;display:block">부스를 눌러서 ☆ 찜 버튼을 눌러보세요</span></div>';
    return;
  }
  el.innerHTML = `<div class="fav-list">${
    favList.map(b => {
      const col = CAT_COLOR[b.category] || '#888';
      return `<button class="fav-chip" onclick="openModal('${b.booth}')">
        <div class="fav-dot" style="background:${col}"></div>
        <span>⭐ ${brandDisplayName(b)}</span>
        <span style="font-size:10px;color:var(--tx3);margin-left:4px">${b.booth}</span>
      </button>`;
    }).join('')
  }</div>`;
}

/* ══════════════════════════════════════════════
   브랜드 목록
══════════════════════════════════════════════ */
function renderBrands(){
  const board = document.getElementById('brand-board');
  const grouped = {};
  booths.forEach(b => { (grouped[b.category] = grouped[b.category] || []).push(b) });
  board.innerHTML = Object.entries(grouped).map(([cat, items]) => {
    const col = CAT_COLOR[cat] || '#888';
    return `<div class="zblock">
      <div class="zhdr">
        <div class="zhdot" style="background:${col}"></div>
        <span class="zhname">${cat}</span>
        <span class="zhcnt">${items.length}개</span>
      </div>
      <div class="cgrid">${items.map(b => brandCard(b, col)).join('')}</div>
    </div>`;
  }).join('');
}

function brandCard(b, col){
  const fav = favorites.has(b.booth);
  const active = curFilter === 'ALL' || b.category === curFilter;
  const kr = brandDisplayName(b);
  const en = brandEnDisplayName(b);
  return `<div class="bcard${fav?' fav':''}${!active?' dim-b':''}" style="--zc:${col}" onclick="openModal('${b.booth}')">
    <div class="bc-booth" style="color:${col}">${b.booth}</div>
    <div class="bc-kr">${kr}</div>
    <div class="bc-en">${en}</div>
    <div class="bc-acts" onclick="event.stopPropagation()">
      <button class="bc-btn${fav?' on':''}" onclick="toggleFav('${b.booth}')">${fav?'⭐':'☆'} 찜</button>
    </div>
  </div>`;
}

/* ══════════════════════════════════════════════
   찜 토글
══════════════════════════════════════════════ */
function toggleFav(boothId){
  favorites.has(boothId) ? favorites.delete(boothId) : favorites.add(boothId);
  saveFavs();
  updateHitboxFav(boothId);
  renderFavs();
  renderBrands();
  updateStats();
  if(curModal === boothId) renderModalActions(boothId);
}

/* ══════════════════════════════════════════════
   통계
══════════════════════════════════════════════ */
function updateStats(){
  document.getElementById('cnt-fav').textContent = favorites.size;
  const mc = memos.length;
  document.getElementById('cnt-memo').textContent = mc;
  const badge = document.getElementById('fab-badge');
  badge.textContent = mc; badge.classList.toggle('show', mc > 0);
}

/* ══════════════════════════════════════════════
   검색
══════════════════════════════════════════════ */
let searchTimer = null;
function onSearch(q){
  document.getElementById('sclr').style.display = q ? 'flex' : 'none';
  clearTimeout(searchTimer);
  if(!q){ document.getElementById('search-results').innerHTML = ''; return; }
  searchTimer = setTimeout(() => doSearch(q), 300);
}
function clearSearch(){
  const inp = document.getElementById('search-inp');
  inp.value = ''; inp.focus();
  onSearch('');
}
function doSearch(q){
  const results = booths.filter(b => boothMatch(b, q));
  const el = document.getElementById('search-results');
  if(!results.length){
    el.innerHTML = '<div class="nores" style="margin-top:1rem">검색 결과가 없어요</div>';
    return;
  }
  const col0 = CAT_COLOR[results[0].category] || '#888';
  el.innerHTML = `<div style="display:flex;flex-wrap:wrap;gap:7px;margin-top:1rem">${
    results.map(b => {
      const col = CAT_COLOR[b.category] || '#888';
      return `<button style="display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:1px solid var(--br);background:var(--sf);color:var(--tx);font-size:13px;cursor:pointer;min-height:44px;transition:all .15s" onclick="searchSelect('${b.booth}')" onmouseenter="this.style.borderColor='${col}'" onmouseleave="this.style.borderColor='var(--br)'">
        <div style="width:7px;height:7px;border-radius:50%;background:${col};flex-shrink:0"></div>
        <span style="font-weight:600">${b.booth}</span>
        <span>${brandDisplayName(b)}</span>
      </button>`;
    }).join('')
  }</div>`;
}

function searchSelect(boothId){
  // 배치도 섹션으로 스크롤
  document.getElementById('sec-map').scrollIntoView({behavior:'smooth', block:'start'});
  setTimeout(() => {
    const hb = document.getElementById('hb-' + boothId);
    // 가로 스크롤 맵 안에서 해당 부스 위치로 이동
    const mscroll = document.querySelector('.map-scroll');
    const mwrap = document.getElementById('map-wrap');
    if(hb && mscroll && mwrap){
      const p = POS[boothId];
      if(p) mscroll.scrollLeft = Math.max(0, (p[0]/100)*mwrap.offsetWidth - mscroll.offsetWidth/2);
    }
    // 하이라이트 시작
    if(hb){
      hb.classList.add('search-hl');
      // 2.5초 하이라이트 후 제거
      setTimeout(() => hb.classList.remove('search-hl'), 2500);
    }
    // 300ms 후 모달 자동 열기
    setTimeout(() => openModal(boothId), 300);
  }, 600);
}

/* ══════════════════════════════════════════════
   모달
══════════════════════════════════════════════ */
function openModal(boothId){
  const b = booths.find(x => x.booth === boothId);
  if(!b) return;
  curModal = boothId;
  const col = CAT_COLOR[b.category] || '#888';
  document.getElementById('m-cat').textContent = b.category;
  document.getElementById('m-cat').style.cssText = `background:${col}22;color:${col};display:inline-block;font-size:11px;padding:4px 12px;border-radius:999px;margin-bottom:.875rem;font-weight:600`;
  document.getElementById('m-booth').textContent = b.booth;
  document.getElementById('m-booth').style.color = col;
  document.getElementById('m-brand').textContent = brandDisplayName(b);
  document.getElementById('m-brand-en').textContent = brandEnDisplayName(b);
  renderModalActions(boothId);
  document.getElementById('modal-ov').classList.add('open');
}
function renderModalActions(boothId){
  const b = booths.find(x => x.booth === boothId);
  if(!b) return;
  const fav = favorites.has(boothId);
  const col = CAT_COLOR[b.category] || '#888';
  let html = `
    <button class="m-btn${fav?' fav-on':''}" onclick="toggleFav('${boothId}')">
      ${fav ? '⭐ 찜됨' : '☆ 찜하기'}
    </button>
    <button class="m-btn" onclick="openMemoForBooth('${boothId}');closeModal()">
      📝 쇼핑 메모 추가
    </button>`;
  if(b.instagram){
    html += `<button class="m-btn ig" onclick="window.open('https://instagram.com/${b.instagram}','_blank')">📸 Instagram 보기</button>`;
  }
  document.getElementById('m-actions').innerHTML = html;
}
function closeModal(){ document.getElementById('modal-ov').classList.remove('open'); curModal = null; }

/* ══════════════════════════════════════════════
   메모
══════════════════════════════════════════════ */
let pendingBoothMemo = null;
function openMemo(){ document.getElementById('memo-ov').classList.add('open'); renderMemoList(); }
function closeMemo(){ document.getElementById('memo-ov').classList.remove('open'); pendingBoothMemo = null; }
function openMemoForBooth(boothId){
  const b = booths.find(x => x.booth === boothId);
  if(b){ const inp = document.getElementById('memo-inp'); inp.value = brandDisplayName(b) + ' — '; pendingBoothMemo = boothId; }
  openMemo();
  setTimeout(() => { const inp = document.getElementById('memo-inp'); inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }, 350);
}
function addMemo(){
  const inp = document.getElementById('memo-inp');
  const t = inp.value.trim();
  if(!t) return;
  const b = pendingBoothMemo ? booths.find(x => x.booth === pendingBoothMemo) : null;
  memos.push({id:Date.now(), text:t, boothId:b?.booth||null, boothName:b?brandDisplayName(b):null, boothCat:b?.category||null, done:false});
  inp.value = ''; pendingBoothMemo = null;
  saveMemos(); renderMemoList(); updateStats();
}
function toggleMemo(id){ const m = memos.find(x=>x.id===id); if(m){ m.done=!m.done; saveMemos(); renderMemoList(); } }
function delMemo(id){ memos = memos.filter(x=>x.id!==id); saveMemos(); renderMemoList(); updateStats(); }
function renderMemoList(){
  const el = document.getElementById('memo-list');
  if(!memos.length){ el.innerHTML = '<div class="memo-empty">메모가 없어요 📝</div>'; return; }
  el.innerHTML = memos.map(m => {
    const col = m.boothCat ? (CAT_COLOR[m.boothCat] || '#888') : '#aaa';
    return `<div class="memo-item">
      <div class="memo-chk${m.done?' done':''}" onclick="toggleMemo(${m.id})">${m.done?'✓':''}</div>
      <div style="flex:1;min-width:0">
        ${m.boothName ? `<div class="memo-brand" style="background:${col}">${m.boothId} ${m.boothName}</div>` : ''}
        <div class="memo-txt${m.done?' done':''}">${m.text}</div>
      </div>
      <button class="memo-del" onclick="delMemo(${m.id})">×</button>
    </div>`;
  }).join('');
}

/* ══════════════════════════════════════════════
   초기화
══════════════════════════════════════════════ */
setTheme('white');
renderLegend();
renderHitboxes();
renderCatChips('map-cats');

renderFavs();
